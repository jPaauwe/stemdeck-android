name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  MODEL_URL: https://huggingface.co/datasets/Retrobear/demucs.cpp/resolve/8f58ac0491bbea657275bcd3e38af1ab3a27bfc9/ggml-model-htdemucs-6s-f16.bin
  MODEL_SHA256: 09704f4ceae204e56e77d5eefd6ac71d7275be81fd507e6913371d59abcee856
  # Demucs v4.1.0's own htdemucs_6s weights (what the app downloads).
  V41_URL: https://huggingface.co/adefossez/HTDemucs-6s/resolve/3c5ee475be622df764938de97e4281a7b07ffa58/5c90dfd2.safetensors
  V41_SHA256: d2a1745f0744721f6b8ca5bf469b67c651ea5ed1b52998cab033b2158609d411

jobs:
  engine:
    name: Separation engine (real model)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Vulkan headers and a software GPU (llvmpipe) for the GPU tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libvulkan-dev mesa-vulkan-drivers glslang-tools >/dev/null
      - name: Build the engine for the CI host
        run: |
          cmake -S engine -B build/engine -DCMAKE_BUILD_TYPE=Release
          cmake --build build/engine -j"$(nproc)"
      - name: Cache the model
        uses: actions/cache@v4
        with:
          path: model
          key: model-${{ env.MODEL_SHA256 }}
      - name: Download and verify the model
        run: |
          mkdir -p model
          if [ ! -f model/htdemucs-6s.bin ]; then
            curl -fsSL --retry 3 -o model/htdemucs-6s.bin "$MODEL_URL"
          fi
          actual=$(sha256sum model/htdemucs-6s.bin | cut -d' ' -f1)
          echo "sha256: $actual"
          if [ "$actual" != "$MODEL_SHA256" ]; then
            echo "::error::model checksum mismatch (got $actual)"; rm -f model/htdemucs-6s.bin; exit 1
          fi
      - name: Cache the Demucs v4.1.0 weights
        uses: actions/cache@v4
        with:
          path: model-v41
          key: model-v41-${{ env.V41_SHA256 }}
      - name: Download Demucs v4.1.0's weights and check them against the ggml file
        run: |
          mkdir -p model-v41
          if [ ! -f model-v41/htdemucs_6s.safetensors ]; then
            curl -fsSL --retry 3 -o model-v41/htdemucs_6s.safetensors "$V41_URL"
          fi
          actual=$(sha256sum model-v41/htdemucs_6s.safetensors | cut -d' ' -f1)
          echo "sha256: $actual"
          if [ "$actual" != "$V41_SHA256" ]; then
            echo "::error::v4.1.0 weights checksum mismatch (got $actual)"; rm -f model-v41/htdemucs_6s.safetensors; exit 1
          fi
          pip install --quiet numpy
          python3 - <<'PY' | tee weights-check.log
          import json, struct, numpy as np
          raw = open("model-v41/htdemucs_6s.safetensors", "rb").read()
          n = struct.unpack_from("<Q", raw, 0)[0]
          header = json.loads(raw[8:8 + n]); base = 8 + n
          meta = header.pop("__metadata__", {})
          print("v4.1.0 file:", meta.get("klass"), len(header), "tensors,",
                sorted({v["dtype"] for v in header.values()}))
          g = open("model/htdemucs-6s.bin", "rb").read(); i = 4; ggml = {}
          while i < len(g):
              nd, ln = struct.unpack_from("<ii", g, i); i += 8
              dims = struct.unpack_from("<" + "i" * nd, g, i); i += 4 * nd
              name = g[i:i + ln].decode(); i += ln
              cnt = int(np.prod(dims)) if nd else 1
              ggml[name] = np.frombuffer(g, np.float16, cnt, i); i += 2 * cnt
          assert set(header) == set(ggml), f"tensor names differ: {set(header) ^ set(ggml)}"
          differ = 0
          for name, t in header.items():
              a, b = t["data_offsets"]
              v = np.frombuffer(raw[base + a:base + b], {"F16": np.float16, "F32": np.float32}[t["dtype"]])
              if not np.array_equal(v.astype(np.float16).view(np.uint16), ggml[name].view(np.uint16)):
                  differ += 1
                  print("differs:", name)
          print(f"{len(header) - differ} of {len(header)} tensors bit for bit identical to the ggml file")
          PY
      - name: Keep a copy of the model in a release (for local profiling)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view model-cache --repo "${{ github.repository }}" >/dev/null 2>&1 || \
            gh release create model-cache model/htdemucs-6s.bin --repo "${{ github.repository }}" \
              --prerelease --title "Model cache (development only)" \
              --notes "The htdemucs_6s ggml weights, for profiling the engine off-device. Not an app release."
      - name: GPU path against the CPU (software GPU)
        run: |
          set -o pipefail
          # The checked-in SPIR-V must compile from the shader sources.
          for f in engine/compute/shaders/*.comp; do glslangValidator -V --target-env vulkan1.1 -o /dev/null "$f"; done
          SD_GPU_ALLOW_CPU=1 build/engine/sdgpu_test 2>&1 | tee gpu-test.log
      - name: Full separation, GPU against CPU (software GPU)
        run: |
          set -o pipefail
          pip install --quiet numpy
          build/engine/sdbench_cli song 20 gpu-song.f32
          mkdir -p out-gpu out-cpu
          { SD_GPU_ALLOW_CPU=1 build/engine/sdengine_cli separate model/htdemucs-6s.bin gpu-song.f32 out-gpu 2 24
            SD_NO_GPU=1 build/engine/sdengine_cli separate model/htdemucs-6s.bin gpu-song.f32 out-cpu 2 24
          } 2>&1 | grep -v "%" | tee gpu-separate.log
          python3 - <<'PY' | tee -a gpu-separate.log
          import numpy as np
          worst = 1e9
          for s in ["drums", "bass", "other", "vocals", "guitar", "piano"]:
              a = np.fromfile(f"out-cpu/{s}.wav", np.int16, offset=44).astype(float)
              b = np.fromfile(f"out-gpu/{s}.wav", np.int16, offset=44).astype(float)
              n = min(len(a), len(b))
              snr = 10 * np.log10((a[:n] ** 2).sum() / max(((a[:n] - b[:n]) ** 2).sum(), 1e-9))
              worst = min(worst, snr)
              print(f"{s}: GPU vs CPU {snr:.1f} dB")
          assert worst > 50, "GPU output differs from the CPU's"
          PY
      - name: Test the engine
        run: |
          pip install --quiet numpy pyloudnorm
          set -o pipefail
          python3 scripts/engine_test.py build/engine/sdengine_cli model/htdemucs-6s.bin build/engine-test 2>&1 | tee engine-test.log
      - name: Benchmark one segment, builds 4-10 vs the app engine (CI host)
        run: |
          set -o pipefail
          {
            echo "baseline:";  build/engine/sdbench_cli_baseline segment model/htdemucs-6s.bin seg-base.f32 2>/dev/null | tail -1
            echo "optimized:"; build/engine/sdbench_cli segment model/htdemucs-6s.bin seg-opt.f32 2>/dev/null | tail -1
            echo "compare:";   build/engine/sdbench_cli compare seg-base.f32 seg-opt.f32
          } | tee bench-host.log
          python3 - <<'PY'
          import json
          lines = open("bench-host.log").read().splitlines()
          b = json.loads(lines[1]); o = json.loads(lines[3]); c = json.loads(lines[5])
          print(f"baseline {b['ms']/1000:.1f} s, optimized {o['ms']/1000:.1f} s, speed-up {b['ms']/o['ms']:.2f}x")
          print("SNR dB vs baseline:", c["snr_db"])
          assert min(c["snr_db"]) > 40, "optimized engine output no longer matches the baseline"
          PY
      - name: Publish logs to a ci-logs branch
        if: always()
        run: |
          mkdir -p /tmp/ci-logs
          cp -f *.log /tmp/ci-logs/ 2>/dev/null || true
          cd /tmp/ci-logs
          echo "run ${{ github.run_id }} job ${{ github.job }} sha ${{ github.sha }}" > INFO.txt
          git init -q -b logs && git add -A
          git -c user.name=ci -c user.email=ci@localhost commit -q -m "logs ${{ github.run_id }} ${{ github.job }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" logs:refs/heads/ci-logs/${{ github.job }}

  analysis:
    name: Analysis stages against desktop StemDeck
    runs-on: ubuntu-24.04
    env:
      ORT_VERSION: 1.31.0
      ORT_SHA256: cc5c72baf5ae5c8238a6841f0897227be2d02826b9cf98eaf02fdefaeeb03a57
      BEAT_THIS_CKPT_SHA256: 8c328b45f59d8dd3dff219253ff6a8d6482be57d0133a29140e2febbf8eb8331
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: scripts/parity-requirements.txt
      - name: Desktop StemDeck's Python at the ported commit (the reference)
        run: |
          git clone -q https://github.com/stemdeckapp/stemdeck upstream
          git -C upstream checkout -q "$(cut -d' ' -f1 app/src/main/assets/web/UPSTREAM_COMMIT)"
          pip install --quiet --extra-index-url https://download.pytorch.org/whl/cpu -r scripts/parity-requirements.txt
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
      - name: ONNX Runtime for the host (same version as the app's)
        run: |
          curl -fsSL --retry 3 -o ort.tgz "https://github.com/microsoft/onnxruntime/releases/download/v$ORT_VERSION/onnxruntime-linux-x64-$ORT_VERSION.tgz"
          echo "$ORT_SHA256  ort.tgz" | sha256sum -c
          tar -xzf ort.tgz
      - name: Build the analysis stages for the host
        run: |
          cmake -S analysis -B build/analysis -DCMAKE_BUILD_TYPE=Release
          cmake --build build/analysis -j"$(nproc)"
      - name: The beat model, exported from its checkpoint (must match models/models.json)
        run: |
          mkdir -p ckpt
          curl -fsSL --retry 3 -o ckpt/final0.ckpt https://cloud.cp.jku.at/public.php/dav/files/7ik4RrBKTS273gp/final0.ckpt
          echo "$BEAT_THIS_CKPT_SHA256  ckpt/final0.ckpt" | sha256sum -c
          python3 scripts/export_models.py --out models-out --beat-this-ckpt ckpt/final0.ckpt --check-manifest 2>&1 | grep -v -i warning | tee export.log
      - name: Test audio (CC-licensed examples from librosa's data repository)
        run: |
          mkdir -p audio && cd audio
          for f in "Kevin_MacLeod_-_Vibe_Ace" "admiralbob77_-_Choice_-_Drum-bass" \
                   "Kevin_MacLeod_-_P_I_Tchaikovsky_Dance_of_the_Sugar_Plum_Fairy" \
                   "Hungarian_Dance_number_5_-_Allegro_in_F_sharp_minor_(string_orchestra)" \
                   "Karissa_Hobbs_-_Lets_Go_Fishin" "147793__setuniman__sweet-waltz-0i-22mi" \
                   "442789__lena-orsa__happy-music-pistachio-ice-cream-ragtime" "snare-accelerate" \
                   "drese-midi" "drese-tempo"; do
            q=$(python3 -c 'import sys,urllib.parse;print(urllib.parse.quote(sys.argv[1]))' "$f.hq.ogg")
            curl -fsSL --retry 3 -o "$f.hq.ogg" "https://librosa.org/data/audio/$q"
          done
      - name: Beat grid, key and click render against desktop
        run: |
          set -o pipefail
          python3 scripts/analysis_parity.py --stages beatgrid,key,click \
            --cli build/analysis/sdanalysis_cli --upstream upstream \
            --beat-ckpt ckpt/final0.ckpt --beat-onnx models-out/beat_this_final0.onnx \
            --ort-lib "onnxruntime-linux-x64-$ORT_VERSION/lib/libonnxruntime.so" \
            --audio audio/*.ogg 2>&1 | grep -v -i -E "warning|autocast" | tee analysis-parity.log
      - name: Click scheduler (JS) against the shared fixture
        run: node scripts/js/click_parity.test.mjs | tee click-js.log
      - name: Mobile UI (Playwright, 384 x 640/740/832)
        run: |
          set -o pipefail
          pip install --quiet playwright==1.56.0
          python3 -m playwright install --with-deps chromium >/dev/null
          python3 scripts/ui_test.py --shots ui-shots 2>&1 | tee ui-test.log
      - name: Publish logs to a ci-logs branch
        if: always()
        run: |
          mkdir -p /tmp/ci-logs
          cp -f *.log /tmp/ci-logs/ 2>/dev/null || true
          cp -rf ui-shots /tmp/ci-logs/ 2>/dev/null || true
          cd /tmp/ci-logs
          echo "run ${{ github.run_id }} job ${{ github.job }} sha ${{ github.sha }}" > INFO.txt
          git init -q -b logs && git add -A
          git -c user.name=ci -c user.email=ci@localhost commit -q -m "logs ${{ github.run_id }} ${{ github.job }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" logs:refs/heads/ci-logs/${{ github.job }}

  apk:
    name: APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Signing key
        env:
          KS: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
          else
            echo "::warning::SIGNING_KEYSTORE_BASE64 is not set; this APK is signed with a throwaway key and will not install over other builds."
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.jks" -storetype PKCS12 \
              -storepass stemdeck-sideload -keypass stemdeck-sideload -alias sideload \
              -keyalg RSA -keysize 3072 -validity 10000 -dname "CN=throwaway"
          fi
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # VERSION names the next public release. Until a release v<VERSION>
          # exists, a push to main builds it; after that, development builds.
          v=$(cat VERSION)
          if [ "${{ github.event_name }}" = push ] && ! gh release view "v$v" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "APP_VERSION=$v" >> "$GITHUB_ENV"
          else
            echo "APP_VERSION=$v-dev.${{ github.run_number }}" >> "$GITHUB_ENV"
          fi
      - name: Build
        env:
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -o pipefail
          ./gradlew --no-daemon :app:testReleaseUnitTest assembleRelease 2>&1 | tee gradle.log
      - name: Native libraries are 16 KB aligned; APK size
        run: |
          set -o pipefail
          python3 scripts/check_apk.py app/build/outputs/apk/release/app-release.apk | tee apk-check.log
      - name: Publish logs to a ci-logs branch
        if: always()
        run: |
          mkdir -p /tmp/ci-logs
          cp -f *.log /tmp/ci-logs/ 2>/dev/null || true
          cd /tmp/ci-logs
          echo "run ${{ github.run_id }} job ${{ github.job }} sha ${{ github.sha }}" > INFO.txt
          git init -q -b logs && git add -A
          git -c user.name=ci -c user.email=ci@localhost commit -q -m "logs ${{ github.run_id }} ${{ github.job }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" logs:refs/heads/ci-logs/${{ github.job }}
      - name: Rename
        run: |
          cp app/build/outputs/apk/release/app-release.apk StemDeck-Android.apk
          cp bench/build/outputs/apk/release/bench-release.apk StemDeck-Bench.apk
          cp compare/build/outputs/apk/release/compare-release.apk StemDeck-Compare.apk
      - uses: actions/upload-artifact@v4
        with:
          name: StemDeck-Android
          path: |
            StemDeck-Android.apk
            StemDeck-Bench.apk
            StemDeck-Compare.apk

  release:
    name: Publish the APK
    needs: [engine, analysis, apk]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            RELEASE_NOTES.md
            VERSION
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          name: StemDeck-Android
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(cat VERSION)
          if ! gh release view "v$v" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            # The public release v<VERSION>: the app only, tagged at this commit.
            gh release create "v$v" StemDeck-Android.apk \
              --repo "${{ github.repository }}" \
              --target "${{ github.sha }}" \
              --title "StemDeck for Android $v" \
              --notes-file RELEASE_NOTES.md \
              --latest
          else
            # Development builds, with the benchmark apps.
            tag="build-${{ github.run_number }}"
            gh release create "$tag" StemDeck-Android.apk StemDeck-Bench.apk StemDeck-Compare.apk \
              --repo "${{ github.repository }}" \
              --title "StemDeck for Android, development build ${{ github.run_number }}" \
              --notes "Development build from ${{ github.sha }}. StemDeck-Android.apk is the app; StemDeck-Bench.apk benchmarks the separation engine; StemDeck-Compare.apk runs a song through several engine builds and compares them." \
              --prerelease
          fi
