name: Models

# Exports the analysis models the app downloads (scripts/export_models.py),
# checks each against PyTorch and against the SHA-256 in models/models.json,
# and publishes them as assets of the models-N pre-release named there, once.
# A published asset is never replaced: the app pins its checksum.
on:
  push:
    branches: [main, 'phase*']
    paths: ['models/**', 'scripts/export_models.py', 'scripts/parity-requirements.txt', '.github/workflows/models.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: scripts/parity-requirements.txt
      - name: Pinned toolchain (the export is reproducible byte for byte with these; same set as the parity job)
        run: pip install --quiet --extra-index-url https://download.pytorch.org/whl/cpu -r scripts/parity-requirements.txt
      - name: Checkpoints
        run: |
          mkdir -p ckpt
          curl -fsSL --retry 3 -o ckpt/final0.ckpt https://cloud.cp.jku.at/public.php/dav/files/7ik4RrBKTS273gp/final0.ckpt
          echo "8c328b45f59d8dd3dff219253ff6a8d6482be57d0133a29140e2febbf8eb8331  ckpt/final0.ckpt" | sha256sum -c
          # All-In-One (harmonix-all), at a pinned revision of the Hub repository.
          mkdir -p ckpt/allinone
          while read -r sha name; do
            curl -fsSL --retry 3 -o "ckpt/allinone/$name" "https://huggingface.co/taejunkim/allinone/resolve/379e5fd010b3fdd0ee8381ff8cbcfa51d70b5c19/$name"
            echo "$sha  ckpt/allinone/$name" | sha256sum -c
          done <<'EOF'
          0db596dfb0995f41d62f6267d76a9d54c046f1649bd35e1dbeca0c5f9a7b8acd harmonix-fold0-0vra4ys2.pth
          607b4864eaabccd4f6951410d5ea6676666ad1cfa6ce2e18bc99f3824b77c3b7 harmonix-fold1-3ozjhtsj.pth
          67c28ec7ca612d365e5fcb152f6530eb53e34c4303940afb30fd17a295c958a4 harmonix-fold2-gmgo0nsy.pth
          446d05672b2669cdb7d9b8bbbc228a4f3592484335a7995cca89a744e3950ddc harmonix-fold3-i92b7m8p.pth
          96327222ab9b33c005388b788ba602f529aa03cc4dde1c859c011f1004490493 harmonix-fold4-1bql5qo0.pth
          c87f162a1090290bcbb863688746784919cf912c56744fb3d81a1a7dba3b114e harmonix-fold5-x4z5zeef.pth
          13e7e639bf30fcd3fa049ad863088773a4e57b06d7c68581385b3ef625c60688 harmonix-fold6-x7t226rq.pth
          b888b7fba95efa3d5a37ca013fe7efe2741621ea9ca335e6b2723e4fd0fade57 harmonix-fold7-qwwskhg6.pth
          EOF
      - name: Export and check
        run: |
          set -o pipefail
          python3 scripts/export_models.py --out out --beat-this-ckpt ckpt/final0.ckpt --allinone-dir ckpt/allinone --check-manifest 2>&1 | grep -v -i -E "warning|autocast" | tee export.log
      - name: Publish what is not published yet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY' > publish.txt
          import json
          m = json.load(open("models/models.json"))
          for name, e in m.items():
              print(e["release"], name)
          PY
          while read -r rel name; do
            if ! gh release view "$rel" --repo "${{ github.repository }}" >/dev/null 2>&1; then
              gh release create "$rel" --repo "${{ github.repository }}" --prerelease \
                --title "Analysis models ($rel)" \
                --notes "Model files StemDeck for Android downloads on first use. Not an app release. Each file is listed with its source, licence and SHA-256 in models/models.json; the app checks the SHA-256 before using a file. Beat This! (CPJKU): MIT. All-In-One (Taejun Kim, Juhan Nam): MIT."
            fi
            if gh release view "$rel" --repo "${{ github.repository }}" --json assets --jq '.assets[].name' | grep -qx "$name"; then
              echo "$rel/$name already published"
            else
              gh release upload "$rel" "out/$name" --repo "${{ github.repository }}"
            fi
          done < publish.txt
      - name: Publish logs to a ci-logs branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci_logs.sh models ${{ github.run_id }} ${{ github.sha }} ${{ job.status == 'failure' }}
